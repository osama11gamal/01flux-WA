{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "01flux-wa.fullname" . }}
  labels:
    {{- include "01flux-wa.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "01flux-wa.selectorLabels" . | nindent 6 }}
{{- end }}
